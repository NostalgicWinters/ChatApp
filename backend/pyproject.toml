[project]
name = "ChatApp-Backend"
version = "0.1.0"
description = "Chat Application Backend"
readme = "README.md"
authors = [
    { name = "NostalgicWinters", email = "Dev.Sterling@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
